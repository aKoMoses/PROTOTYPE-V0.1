name: Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager --install 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import game assets
        run: godot --headless --path . --editor --quit

      - name: Run game tests
        run: |
          set -euo pipefail
          for test_file in tools/test_*.gd; do
            echo "Running $test_file"
            godot --headless --path . --script "res://$test_file"
          done

      - name: Check signing configuration
        env:
          KEYSTORE_B64: ${{ secrets.PROTOTYPE0_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PROTOTYPE0_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo 'Configure PROTOTYPE0_KEYSTORE_BASE64 and PROTOTYPE0_KEYSTORE_PASSWORD before publishing.' >&2
            exit 1
          fi

      - name: Prepare Android version and signing key
        env:
          KEYSTORE_B64: ${{ secrets.PROTOTYPE0_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.PROTOTYPE0_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: prototype0test
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/prototype0-test.jks"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/prototype0-test.jks" >> "$GITHUB_ENV"
          python3 tools/prepare_android_ci.py "$RUN_NUMBER" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/prototype0-test.jks" \
            -alias prototype0test -storepass "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" > /dev/null

      - name: Export signed APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.PROTOTYPE0_KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: prototype0test
        run: |
          set -euo pipefail
          mkdir -p exports
          godot --headless --path . --export-release Android exports/prototype0-android.apk
          test -s exports/prototype0-android.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose exports/prototype0-android.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging exports/prototype0-android.apk | head -n 1

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" exports/prototype0-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Prototype 0 $RELEASE_TAG" \
            --notes "Build de test Android issue du commit $GITHUB_SHA." \
            --prerelease
